<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Paper shadow -->
    <filter id="page-shadow" x="0" y="0" width="256" height="256" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="5" stdDeviation="4.5" flood-color="#081830" flood-opacity="0.44" />
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#081830" flood-opacity="0.28" />
    </filter>

    <!-- Badge shadow onto paper -->
    <filter id="badge-shadow" x="0" y="16" width="180" height="180" filterUnits="userSpaceOnUse">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#061630" flood-opacity="0.52" />
    </filter>

    <!-- W 3D Shadow -->
    <filter id="w-shadow" x="18" y="44" width="124" height="116" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1.8" dy="2.8" stdDeviation="1.2" flood-color="#06183e" flood-opacity="0.7" />
    </filter>

    <!-- Paper gradient -->
    <linearGradient id="page-grad" x1="40" y1="10" x2="246" y2="246" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#f6faff" />
      <stop offset="100%" stop-color="#dce8f5" />
    </linearGradient>

    <!-- Fold flap gradient -->
    <linearGradient id="fold-grad" x1="174" y1="10" x2="246" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#cadcf0" />
      <stop offset="35%" stop-color="#edf4fa" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Fold underside shadow -->
    <linearGradient id="fold-shadow" x1="174" y1="82" x2="194" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#102542" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#102542" stop-opacity="0" />
    </linearGradient>

    <!-- Badge border gradient -->
    <linearGradient id="badge-border" x1="8" y1="28" x2="148" y2="168" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#366ec6" />
      <stop offset="100%" stop-color="#0e326e" />
    </linearGradient>

    <!-- Badge face gradient -->
    <linearGradient id="badge-face" x1="18" y1="38" x2="138" y2="158" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f5f9fe" />
      <stop offset="100%" stop-color="#dfeaf6" />
    </linearGradient>

    <!-- 3D Blue W Gradient (Office 2003 Royal Blue) -->
    <linearGradient id="w-grad" x1="28" y1="50" x2="128" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b7ef0" />
      <stop offset="25%" stop-color="#1e5ccd" />
      <stop offset="70%" stop-color="#123ea2" />
      <stop offset="100%" stop-color="#0a266e" />
    </linearGradient>

    <!-- Graphic thumbnail gradient -->
    <linearGradient id="thumb-grad" x1="154" y1="38" x2="230" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c5dcf4" />
    </linearGradient>
  </defs>

  <!-- Document Sheet with Shadow -->
  <g filter="url(#page-shadow)">
    <!-- Sheet background -->
    <path
      d="M 34 10
         L 174 10
         L 246 82
         L 246 240
         A 6 6 0 0 1 240 246
         L 34 246
         A 6 6 0 0 1 28 240
         L 28 16
         A 6 6 0 0 1 34 10 Z"
      fill="url(#page-grad)"
      stroke="#354c6a"
      stroke-width="3.5"
      stroke-linejoin="round"
    />

    <!-- Inner top/left bevel highlight for crisp edge -->
    <path
      d="M 34 13
         L 173 13
         M 30.5 18
         L 30.5 240"
      stroke="#ffffff"
      stroke-width="2"
      stroke-linecap="round"
    />

    <!-- Fold shadow -->
    <path
      d="M 174 82
         L 174 102
         L 246 82 Z"
      fill="url(#fold-shadow)"
    />

    <!-- Fold flap -->
    <path
      d="M 174 10
         L 174 76
         A 6 6 0 0 0 180 82
         L 246 82 Z"
      fill="url(#fold-grad)"
      stroke="#354c6a"
      stroke-width="3.5"
      stroke-linejoin="round"
    />

    <!-- Inner flap highlight -->
    <line x1="176" y1="12" x2="176" y2="80" stroke="#ffffff" stroke-width="1.8" />
    <line x1="176" y1="80" x2="244" y2="80" stroke="#ffffff" stroke-width="1.8" />

    <!-- Graphic thumbnail (picture placeholder under fold) -->
    <rect
      x="154"
      y="38"
      width="76"
      height="68"
      rx="4"
      fill="url(#thumb-grad)"
      stroke="#577da6"
      stroke-width="2.5"
    />
    <!-- Miniature chart/sun inside thumbnail -->
    <rect x="160" y="44" width="64" height="22" rx="2" fill="#88b5e4" opacity="0.85" />
    <circle cx="172" cy="84" r="7" fill="#f59e0b" />
    <path d="M 160 100 L 182 78 L 198 94 L 210 82 L 224 100 Z" fill="#4688d4" opacity="0.9" />

    <!-- Ruled lines beside badge -->
    <line x1="154" y1="124" x2="232" y2="124" stroke="#6082a6" stroke-width="5.5" stroke-linecap="round" />
    <line x1="154" y1="142" x2="238" y2="142" stroke="#6082a6" stroke-width="5.5" stroke-linecap="round" />
    <line x1="154" y1="160" x2="228" y2="160" stroke="#6082a6" stroke-width="5.5" stroke-linecap="round" />
    <line x1="154" y1="178" x2="234" y2="178" stroke="#6082a6" stroke-width="5.5" stroke-linecap="round" />

    <!-- Ruled lines below badge -->
    <line x1="40" y1="198" x2="236" y2="198" stroke="#6082a6" stroke-width="6" stroke-linecap="round" />
    <line x1="40" y1="216" x2="226" y2="216" stroke="#6082a6" stroke-width="6" stroke-linecap="round" />
    <line x1="40" y1="234" x2="176" y2="234" stroke="#6082a6" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Word Badge Overhanging Left Side -->
  <g filter="url(#badge-shadow)">
    <!-- Outer border frame -->
    <rect
      x="8"
      y="28"
      width="142"
      height="140"
      rx="16"
      fill="url(#badge-border)"
      stroke="#0c2652"
      stroke-width="1.5"
    />

    <!-- Inner vibrant cerulean border -->
    <rect
      x="12"
      y="32"
      width="134"
      height="132"
      rx="12"
      fill="#528fe8"
    />

    <!-- White/Ice Face -->
    <rect
      x="18"
      y="38"
      width="122"
      height="120"
      rx="8"
      fill="url(#badge-face)"
    />

    <!-- 3D Bevel highlight on face -->
    <path
      d="M 21 41 L 137 41 M 21 41 L 21 155"
      stroke="#ffffff"
      stroke-width="2.2"
      stroke-linecap="round"
    />

    <!-- Wide, Bold, Authentic 3D Blue Serif "W" -->
    <g filter="url(#w-shadow)">
      <path
        d="M 24 52
           L 47 52
           L 47 58
           L 40 59
           L 52 124
           L 68 64
           L 61 59
           L 61 52
           L 81 52
           L 81 58
           L 74 59
           L 86 124
           L 102 64
           L 95 59
           L 95 52
           L 118 52
           L 118 58
           L 111 59
           L 93 144
           L 80 144
           L 71 85
           L 62 144
           L 49 144
           L 32 59
           L 24 58 Z"
        fill="url(#w-grad)"
        stroke="#0a2258"
        stroke-width="1.8"
        stroke-linejoin="round"
        fill-rule="evenodd"
      />
    </g>

    <!-- Crisp highlights on top serifs and diagonal edges -->
    <path
      d="M 25 53.5 L 46 53.5
         M 62 53.5 L 80 53.5
         M 96 53.5 L 117 53.5
         M 40.5 60 L 50 120
         M 74.5 60 L 84 120"
      stroke="#9bc3ff"
      stroke-width="1.6"
      stroke-linecap="round"
      opacity="0.9"
    />
  </g>
</svg>
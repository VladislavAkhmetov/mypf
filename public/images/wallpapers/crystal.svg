<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="crySky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="40%" stop-color="#082f49"/>
      <stop offset="75%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="auroraGreen" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="40%" stop-color="#34d399" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="peakIce" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="lakeIce" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="40%" stop-color="#083344"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- Twilight Sky -->
  <rect width="1920" height="1080" fill="url(#crySky)"/>

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="150" cy="90" r="1.5"/>
    <circle cx="420" cy="140" r="1"/>
    <circle cx="700" cy="70" r="2"/>
    <circle cx="1020" cy="110" r="1.5"/>
    <circle cx="1340" cy="80" r="1"/>
    <circle cx="1600" cy="150" r="2"/>
    <circle cx="1850" cy="90" r="1.5"/>
  </g>

  <!-- Aurora Waves -->
  <path d="M0,320 Q480,180 960,260 T1920,200 L1920,450 L0,450 Z" fill="url(#auroraGreen)"/>
  <path d="M0,390 Q540,260 1100,340 T1920,300 L1920,520 L0,520 Z" fill="url(#auroraGreen)" opacity="0.7"/>

  <!-- Mountain Peaks (Background) -->
  <polygon points="120,620 340,360 560,620" fill="url(#peakIce)"/>
  <polygon points="460,620 740,310 1020,620" fill="url(#peakIce)"/>
  <polygon points="900,620 1200,340 1500,620" fill="url(#peakIce)"/>
  <polygon points="1380,620 1650,380 1920,620" fill="url(#peakIce)"/>

  <!-- Crystal Frozen Lake -->
  <rect y="620" width="1920" height="260" fill="url(#lakeIce)"/>
  <!-- Reflection sheen on ice -->
  <path d="M400,650 Q700,640 1000,650 T1600,650" stroke="#67e8f9" stroke-width="2" opacity="0.4" fill="none"/>
  <path d="M200,690 Q600,680 1100,690 T1800,690" stroke="#a5f3fc" stroke-width="1.5" opacity="0.3" fill="none"/>

  <!-- Snowy Shoreline Foreground -->
  <path d="M0,840 Q460,780 1040,850 T1920,810 L1920,1080 L0,1080 Z" fill="#0f172a"/>
  <path d="M0,840 Q460,780 1040,850 T1920,810" stroke="#94a3b8" stroke-width="8" fill="none"/>

  <!-- Snowy Pine Silhouettes (Left) -->
  <g fill="#020617" transform="translate(140, 680)">
    <polygon points="40,240 20,180 30,180 15,130 25,130 10,80 40,30 70,80 55,130 65,130 50,180 60,180"/>
    <polygon points="110,250 90,190 100,190 85,140 95,140 80,90 110,40 140,90 125,140 135,140 120,190 130,190"/>
  </g>

  <!-- Snowy Pine Silhouettes (Right) -->
  <g fill="#020617" transform="translate(1620, 690)">
    <polygon points="50,230 30,170 40,170 25,120 35,120 20,70 50,20 80,70 65,120 75,120 60,170 70,170"/>
  </g>
</svg>

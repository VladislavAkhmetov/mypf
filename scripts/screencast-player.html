<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PrintPlix Prepress Plugin Showcase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #0b0f19;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #f1f5f9;
  }

  /* Ambient CMYK spatial lighting */
  .ambient-cmyk {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .cmyk-orb-cyan {
    position: absolute;
    top: 10%;
    left: 15%;
    width: 650px;
    height: 650px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(13, 153, 255, 0.15) 0%, transparent 70%);
    filter: blur(80px);
  }
  .cmyk-orb-magenta {
    position: absolute;
    bottom: 10%;
    right: 15%;
    width: 650px;
    height: 650px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(225, 29, 72, 0.12) 0%, transparent 70%);
    filter: blur(80px);
  }

  /* Grid dots */
  .grid-pattern {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none;
    z-index: 1;
  }

  /* Camera rig for dynamic pan & zoom */
  #camera-rig {
    position: absolute;
    top: 0;
    left: 0;
    width: 1920px;
    height: 1080px;
    transform-origin: 0 0;
    will-change: transform;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Central Window Frame */
  .plugin-window-card {
    width: 760px;
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 
      0 35px 80px -15px rgba(0, 0, 0, 0.65),
      0 15px 30px -10px rgba(13, 153, 255, 0.15),
      0 0 0 1px rgba(255, 255, 255, 0.15);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 12;
  }

  /* Sleek macOS Titlebar */
  .window-titlebar {
    height: 40px;
    background: #f8fafc;
    border-bottom: 1px solid rgba(15, 23, 42, 0.08);
    display: flex;
    align-items: center;
    padding: 0 16px;
    position: relative;
  }
  .window-dots {
    display: flex;
    gap: 7px;
  }
  .dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
  }
  .dot-red { background: #ff5f56; }
  .dot-yellow { background: #ffbd2e; }
  .dot-green { background: #27c93f; }

  .window-title {
    position: absolute;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    color: #475569;
    font-family: 'JetBrains Mono', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .title-badge {
    font-size: 10px;
    background: rgba(13, 153, 255, 0.1);
    color: #0d99ff;
    padding: 1px 6px;
    border-radius: 4px;
  }

  /* The actual plugin iframe */
  #plugin-frame {
    width: 760px;
    height: 770px;
    border: none;
    display: block;
    background: #f4f6fb;
  }

  /* Realistic Cursor */
  #cursor {
    position: absolute;
    top: 0;
    left: 0;
    width: 24px;
    height: 24px;
    pointer-events: none;
    z-index: 9999;
    will-change: transform;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.45));
    transition: opacity 0.2s ease;
  }
  .cursor-svg {
    width: 24px;
    height: 24px;
  }

  /* Click Ripple */
  #ripple {
    position: absolute;
    width: 46px;
    height: 46px;
    margin-left: -23px;
    margin-top: -23px;
    border-radius: 50%;
    border: 2.5px solid #0d99ff;
    background: rgba(13, 153, 255, 0.25);
    pointer-events: none;
    z-index: 9998;
    transform: scale(0);
    opacity: 0;
  }
  .ripple-animate {
    animation: ripple-pulse 0.45s ease-out forwards;
  }
  @keyframes ripple-pulse {
    0% { transform: scale(0.2); opacity: 1; }
    100% { transform: scale(2.4); opacity: 0; }
  }

  /* Subtle status badge on bottom left of screen */
  .status-hud {
    position: absolute;
    bottom: 28px;
    left: 36px;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 999px;
    padding: 8px 18px;
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    color: #e2e8f0;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  }
  .hud-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #0d99ff;
    box-shadow: 0 0 10px #0d99ff;
  }
  .hud-text { font-weight: 600; }
</style>
</head>
<body>

<div class="ambient-cmyk">
  <div class="cmyk-orb-cyan"></div>
  <div class="cmyk-orb-magenta"></div>
</div>
<div class="grid-pattern"></div>

<div id="camera-rig">
  <div class="plugin-window-card">
    <div class="window-titlebar">
      <div class="window-dots">
        <span class="dot dot-red"></span>
        <span class="dot dot-yellow"></span>
        <span class="dot dot-green"></span>
      </div>
      <div class="window-title">
        <span>PrintPlix</span>
        <span class="title-badge">CMYK & PREPRESS</span>
      </div>
    </div>
    <iframe id="plugin-frame" src="http://localhost:3005"></iframe>
  </div>
</div>

<div id="ripple"></div>
<div id="cursor">
  <svg class="cursor-svg" viewBox="0 0 24 24" fill="none">
    <path d="M5.5 2.5L18.5 13.5L12 14.5L15.5 21.5L12.5 23L9 16L4 20.5L5.5 2.5Z" fill="#0f172a" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round"/>
  </svg>
</div>

<div class="status-hud">
  <div class="hud-dot" id="hud-indicator"></div>
  <span class="hud-text" id="hud-caption">PrintPlix Prepress Engine Active</span>
</div>

<script>
  const rig = document.getElementById('camera-rig');
  const cursor = document.getElementById('cursor');
  const ripple = document.getElementById('ripple');
  const hudCaption = document.getElementById('hud-caption');

  window.setHUD = function(text) {
    if (hudCaption) hudCaption.textContent = text;
  };

  window.triggerRipple = function(x, y) {
    ripple.style.left = x + 'px';
    ripple.style.top = y + 'px';
    ripple.classList.remove('ripple-animate');
    void ripple.offsetWidth;
    ripple.classList.add('ripple-animate');
  };

  window.setCamera = function(zoom, tx, ty) {
    rig.style.transform = `scale(${zoom}) translate(${tx}px, ${ty}px)`;
  };

  window.setCursor = function(x, y) {
    cursor.style.transform = `translate(${x}px, ${y}px)`;
  };
</script>
</body>
</html>
